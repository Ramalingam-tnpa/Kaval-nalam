<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>காவல் நலம் · Kaaval Nalam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta+Malar:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1e2761; --navy-2:#2b3680; --khaki:#cdb98a; --khaki-soft:#eee6d1; --saffron:#e8a33d;
  --teal:#2f7d7a; --red:#b8433a; --green:#3f7d58;
  --bg:#e9edf4; --surface:#ffffff; --surface-2:#f4f6fa; --ink:#1a1f33; --muted:#5a6380; --line:#d7dce8;
  --shadow:0 1px 0 rgba(30,39,97,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1230; --surface:#161d45; --surface-2:#1d2552; --ink:#eef0f8; --muted:#aab2cf; --line:#2c3566;
    --khaki-soft:#3a3526; --navy:#c9d1f5; --navy-2:#9fb0f0; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1230; --surface:#161d45; --surface-2:#1d2552; --ink:#eef0f8; --muted:#aab2cf; --line:#2c3566;
  --khaki-soft:#3a3526; --navy:#c9d1f5; --navy-2:#9fb0f0; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Mukta Malar","Noto Sans Tamil","Nirmala UI","Latha",system-ui,sans-serif;font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px;border-radius:6px}
.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
@media (min-width:760px){ .app{margin:24px auto;min-height:calc(100vh - 48px);border-radius:28px;overflow:hidden;border:1px solid var(--line)} }

/* Header: shoulder-badge band */
.band{background:#1e2761;color:#fff;padding:14px 18px 0;position:relative}
.band-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{display:flex;align-items:center;gap:10px}
.star{width:34px;height:34px;flex:none}
.brand-ta{font-weight:800;font-size:22px;line-height:1.1;letter-spacing:.2px}
.brand-en{font-size:12.5px;color:#cdb98a;letter-spacing:.6px}
.lang{display:flex;background:rgba(255,255,255,.12);border-radius:999px;padding:3px}
.lang button{border:0;background:transparent;color:#dfe4f7;font-size:13px;padding:5px 10px;border-radius:999px;font-weight:600}
.lang button[aria-pressed="true"]{background:#cdb98a;color:#1e2761}
.stripe{height:10px;margin:12px -18px 0;background:repeating-linear-gradient(90deg,#cdb98a 0 22px,#b9a371 22px 24px)}
.notice{font-size:12.5px;color:var(--muted);background:var(--surface-2);border-bottom:1px solid var(--line);padding:7px 18px}

main{flex:1;padding:18px 16px 110px}
h1{font-size:25px;line-height:1.25;margin:4px 0 6px;font-weight:800;color:var(--navy)}
h2{font-size:19px;margin:22px 0 8px;font-weight:700;color:var(--navy)}
p{margin:0 0 10px}
.sub{display:block;font-size:.82em;color:var(--muted);font-weight:500;line-height:1.35}
.muted{color:var(--muted)}
.small{font-size:14px}

.greet{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.moods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.mood{border:2px solid var(--line);background:var(--surface-2);border-radius:14px;padding:10px 6px;text-align:center;font-weight:700}
.mood svg{display:block;margin:0 auto 4px}
.mood[aria-pressed="true"]{border-color:var(--saffron);background:var(--khaki-soft)}
.moodmsg{margin-top:12px;padding:10px 12px;border-left:4px solid var(--teal);background:var(--surface-2);border-radius:0 10px 10px 0}

.list{display:flex;flex-direction:column;gap:0;margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:14px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;width:100%}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;color:#fff}
.row .t{font-weight:700;display:block}
.chev{margin-left:auto;color:var(--muted);flex:none}

.lock{display:flex;gap:8px;align-items:flex-start;margin-top:14px;font-size:14px;color:var(--green)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 16px;font-weight:700;background:#1e2761;color:#fff;width:100%;text-decoration:none;text-align:center}
.btn.sec{background:var(--surface);color:var(--navy);border:2px solid var(--line)}
.btn.teal{background:var(--teal)} .btn.red{background:var(--red)} .btn.saff{background:var(--saffron);color:#1e2761}
.btn:disabled{opacity:.45;cursor:not-allowed}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px}
.crisis{background:#fbeceb;border:2px solid var(--red);color:#4a1712}
:root[data-theme="dark"] .crisis{background:#3a1a1a;color:#ffdcd8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .crisis{background:#3a1a1a;color:#ffdcd8}}
.crisis h2{color:var(--red);margin-top:0}

.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0 14px}
.progress i{display:block;height:100%;background:var(--saffron)}
.q{font-size:20px;font-weight:700;line-height:1.35;margin:6px 0 12px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 14px;text-align:left;display:flex;gap:10px;align-items:center}
.opt[aria-pressed="true"]{border-color:var(--navy);background:var(--khaki-soft)}
.opt .n{width:28px;height:28px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-weight:800;font-size:14px;flex:none;border:1px solid var(--line)}

.gauge{display:flex;align-items:center;gap:16px}
.gauge svg{flex:none}
.score{font-size:42px;font-weight:800;line-height:1;color:var(--navy)}

label.f{display:block;font-weight:700;margin:14px 0 6px}
input[type=number],input[type=text],select,textarea{width:100%;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--surface)}
input[type=range]{width:100%;accent-color:#e8a33d}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:600;font-size:15px}
.chip[aria-pressed="true"]{border-color:var(--navy);background:var(--khaki-soft)}

.chart{width:100%;height:auto;display:block;margin-top:8px}
.weeks{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:10px}
.wk{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;margin-top:8px;color:var(--muted)}
.legend b{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}

.breath{display:grid;place-items:center;margin:18px 0}
.circle{width:210px;height:210px;border-radius:50%;background:radial-gradient(circle at 50% 45%,#f4c77e,#e8a33d 60%,#c9862a);display:grid;place-items:center;color:#1e2761;font-weight:800;font-size:22px;text-align:center;transition:transform 4s linear;transform:scale(.62);box-shadow:0 0 0 14px rgba(232,163,61,.18)}
.circle.big{transform:scale(1)}
@media (prefers-reduced-motion: reduce){.circle{transition:none}}

.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi .v{font-size:28px;font-weight:800;line-height:1.1}
.bar{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%}
.urow{padding:10px 0;border-bottom:1px solid var(--line)}
.urow:last-child{border-bottom:0}
.tag{display:inline-block;font-size:12.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--khaki-soft);color:var(--ink)}

.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#1e2761;color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;z-index:50;max-width:90vw;text-align:center}

nav.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;z-index:40;pointer-events:none}
nav.tabs .in{pointer-events:auto;max-width:480px;width:100%;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 2px;font-size:12px;font-weight:600;color:var(--muted);line-height:1.15}
nav.tabs button[aria-current="page"]{color:var(--navy)}
nav.tabs button[aria-current="page"] svg{color:#e8a33d}
nav.tabs .help-tab svg{color:var(--red)}
.back{border:0;background:transparent;color:var(--navy);font-weight:700;padding:0;margin-bottom:6px;display:inline-flex;gap:4px;align-items:center}
ul.tips{padding-left:20px;margin:6px 0}
ul.tips li{margin-bottom:8px}
a.tel{color:inherit}
.ref{font-size:26px;font-weight:800;letter-spacing:2px;color:var(--navy)}
</style>
</head>

function vCheck(){
  if(view.step===0){
    const hist=S.checks.slice(-5).reverse().map(c=>`<div class="urow"><b>${c.score}</b> / 100 <span class="muted small">— ${esc(c.date)}</span></div>`).join('')||`<p class="muted">${esc(L('none'))}</p>`;

      <button class="btn" data-act="startCheck">${esc(L('start'))}</button>
      <h2>${tx('history')}</h2><div class="card">${hist}</div>
      <p class="muted small" style="margin-top:12px">${tx('notDiag')}</p>`;
  }
  if(view.step>=1 && view.step<=5){
    const i=view.step-1, sel=view.answers[i];
    const opts=[5,4,3,2,1,0].map(v=>`<button class="opt" data-ans="${v}" aria-pressed="${sel===v}"><span class="n">${v}</span><span>${tx('o'+v)}</span></button>`).join('');
    return `${backBtn('check')}<div class="muted small">${esc(L('qOf'))} ${view.step} / 6</div>
      <div class="progress" aria-hidden="true"><i style="width:${view.step/6*100}%"></i></div>
      <p class="muted">${tx('lastTwo')}</p><div class="q">${tx(QS[i])}</div>

      <div class="two" style="margin-top:14px"><button class="btn sec" data-act="prevQ">${esc(L('prev'))}</button><button class="btn" data-act="nextQ" ${sel===undefined?'disabled':''}>${esc(L('next'))}</button></div>`;

    return `${backBtn('check')}<div class="muted small">${esc(L('qOf'))} 6 / 6</div>
      <div class="progress" aria-hidden="true"><i style="width:100%"></i></div>
      <div class="q">${tx('qSafety')}</div>

  }
  return vResult();
}

function vResult(){

     <h2 style="color:${col}">${tx('band'+band)}</h2><p>${tx('band'+band+'P')}</p>

function sleepChart(){
  const d=S.sleep.slice(-7); if(!d.length) return `<p class="muted">${esc(L('none'))}</p>`;
  const W=320,H=170,pad=26,bw=(W-pad*2)/7;
  const y=v=>H-22-(v/16)*(H-40);
  let bars='',pts=[],labels='';
  d.forEach((e,i)=>{const x=pad+i*bw;
    bars+=`<rect x="${x+bw*.2}" y="${y(e.h)}" width="${bw*.6}" height="${H-22-y(e.h)}" rx="3" fill="${e.h<6?'#b8433a':'#2b3680'}"/>`;
    pts.push(`${x+bw/2},${y(e.d)}`);
    labels+=`<text x="${x+bw/2}" y="${H-6}" font-size="10" text-anchor="middle" fill="currentColor">${e.date.slice(5)}</text>`;});
  const grid=[0,4,8,12,16].map(v=>`<line x1="${pad}" x2="${W-6}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="4" y="${y(v)+3}" font-size="10" fill="currentColor">${v}</text>`).join('');
  const avgH=(d.reduce((a,e)=>a+e.h,0)/d.length).toFixed(1), avgD=(d.reduce((a,e)=>a+e.d,0)/d.length).toFixed(1);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(L('last7'))}" style="color:var(--muted)">${grid}${bars}<polyline points="${pts.join(' ')}" fill="none" stroke="#e8a33d" stroke-width="3"/>${d.map((e,i)=>`<circle cx="${pad+i*bw+bw/2}" cy="${y(e.d)}" r="3.5" fill="#e8a33d"/>`).join('')}${labels}</svg>
   <div class="legend"><span><b style="background:#2b3680"></b>${esc(L('lgSleep'))}</span><span><b style="background:#e8a33d"></b>${esc(L('lgDuty'))}</span><span><b style="background:#b8433a"></b>&lt; 6 ${esc(L('hrs'))}</span></div>
   <div class="two" style="margin-top:10px"><div class="kpi"><div class="muted small">${esc(L('avgSleep'))}</div><div class="v">${avgH}</div></div><div class="kpi"><div class="muted small">${esc(L('avgDuty'))}</div><div class="v">${avgD}</div></div></div>
   ${avgH<6?`<p class="moodmsg" style="margin-top:10px">${tx('sleepWarn')}</p>`:''}`;
}
function offWeeks(){
  const map={}; S.off.forEach(o=>map[o.week]=o.v);
  const out=[]; const now=new Date();
  for(let i=7;i>=0;i--){const d=new Date(now);d.setDate(d.getDate()-7*i);const k=weekKey(d);out.push({k,v:map[k]});}
  return out;
}
function vLog(){
  const ex=S.sleep.find(e=>e.date===today());
  const wk=offWeeks(); const cur=wk[7].v;
  const rated=wk.filter(w=>w.v); const rest=rated.filter(w=>w.v!=='offNo').length;
  const col={offYes:'#3f7d58',offComp:'#e8a33d',offNo:'#b8433a'};
  return `<h1>${tx('logTitle')}</h1>
   <h2>${tx('sleepH')}</h2>
   <div class="card">
    <label class="f" for="sh">${tx('slept')}</label><input id="sh" type="number" min="0" max="16" step="0.5" inputmode="decimal" value="${ex?ex.h:''}">
    <label class="f" for="sq">${tx('quality')}: <b id="sqv">${ex?ex.q:3}</b>/5</label><input id="sq" type="range" min="1" max="5" value="${ex?ex.q:3}">
    <div class="legend" style="justify-content:space-between;margin-top:0"><span>${esc(L('qPoor'))}</span><span>${esc(L('qGood'))}</span></div>
    <label class="f" for="dh">${tx('duty')}</label><input id="dh" type="number" min="0" max="24" step="0.5" inputmode="decimal" value="${ex?ex.d:''}">
    <div class="stack"><button class="btn" data-act="saveSleep">${esc(L('saveEntry'))}</button></div>
   </div>
   <div class="card"><div style="font-weight:700">${tx('last7')}</div>${sleepChart()}</div>
   <h2>${tx('offH')}</h2>
   <div class="card">
    <p style="font-weight:700">${tx('offQ')}</p>
    <div class="chips">${['offYes','offComp','offNo'].map(k=>`<button class="chip" data-off="${k}" aria-pressed="${cur===k}">${esc(L(k))}</button>`).join('')}</div>
    <div class="weeks" role="img" aria-label="${esc(L('offRate'))}">${wk.map((w,i)=>`<div class="wk" style="background:${w.v?col[w.v]:'var(--line)'};color:${w.v?'#fff':'var(--muted)'}" title="${w.k}">${esc(L('wk'))}${i+1}</div>`).join('')}</div>
    <div class="legend"><span><b style="background:#3f7d58"></b>${esc(L('offYes'))}</span><span><b style="background:#e8a33d"></b>${esc(L('offComp'))}</span><span><b style="background:#b8433a"></b>${esc(L('offNo'))}</span></div>
    <p style="margin-top:10px">${tx('offRate')}: <b>${rest} / ${rated.length||0}</b></p>
    <p class="muted small">${tx('offNote')}</p>
   </div>`;
}

let incTypes=[];
function vIncident(){
  if(view.incStage==='done'){
    return `${backBtn()}<h1>${tx('incTitle')}</h1><div class="card"><p>${tx(view.incMsg)}</p></div><div class="stack"><button class="btn sec" data-go="home">${esc(L('home'))}</button></div>`;
  }
  if(view.incStage==='yes'){
    return `${backBtn('incident')}<h1>${tx('incTitle')}</h1>
     <div class="card"><div style="font-weight:700;margin-bottom:8px">${tx('incType')}</div>
      <div class="chips">${['i1','i2','i3','i4','i5','i6'].map(k=>`<button class="chip" data-inc="${k}" aria-pressed="${incTypes.includes(k)}">${esc(L(k))}</button>`).join('')}</div></div>
     <div class="card"><h2 style="margin-top:0">${tx('normalH')}</h2><ul class="tips">${listBoth('normalL')}</ul><p>${tx('normalP')}</p></div>
     <h2>${tx('incWhat')}</h2>
     <div class="stack">
      <button class="btn sec" data-act="incFine">${esc(L('incFine'))}</button>
      <button class="btn teal" data-act="incWO">${esc(L('incWO'))}</button>
      <a class="btn red" href="tel:14416">${esc(L('callTM'))}</a>
      <button class="btn sec" data-go="breath">${esc(L('doBreath'))}</button>
     </div>`;
  }
  return `${backBtn()}<h1>${tx('incTitle')}</h1><div class="card"><p class="q" style="font-size:19px">${tx('incQ')}</p>
   <div class="two"><button class="btn" data-act="incYes">${esc(L('yes'))}</button><button class="btn sec" data-act="incNo">${esc(L('no'))}</button></div></div>
   <div class="lock">${I.lock}<span>${tx('lockLine')}</span></div>`;
}

let brTimer=null, brPhase=0, brCount=4, brRounds=0;
function vBreath(){
  const phases=['bIn','bHold','bOut','bHold'];
  const label=view.brOn?`${esc(L(phases[brPhase]))}<br><span style="font-size:40px">${brCount}</span>`:esc(L('bReady'));
  return `${backBtn()}<h1>${tx('brTitle')}</h1><p>${tx('brIntro')}</p>
   <div class="breath"><div class="circle ${view.brOn&&(brPhase===0||brPhase===1)?'big':''}" id="circle" aria-live="polite">${label}</div></div>
   <p style="text-align:center">${esc(L('rounds'))}: <b id="rounds">${brRounds}</b></p>
   <div class="stack">${view.brOn?`<button class="btn red" data-act="brStop">${esc(L('bStop'))}</button>`:`<button class="btn saff" data-act="brStart">${esc(L('bStart'))}</button>`}</div>`;
}
function brTick(){
  brCount--;
  if(brCount===0){brCount=4;brPhase=(brPhase+1)%4;if(brPhase===0)brRounds++;}
  const c=$('#circle'); if(!c){clearInterval(brTimer);view.brOn=false;return;}
  const phases=['bIn','bHold','bOut','bHold'];
  c.innerHTML=`${esc(L(phases[brPhase]))}<br><span style="font-size:40px">${brCount}</span>`;
  c.classList.toggle('big',brPhase===0||brPhase===1);
  $('#rounds').textContent=brRounds;
}

function vFamily(){
  return `${backBtn('more')}<h1>${tx('famTitle')}</h1><p>${tx('famIntro')}</p>
   <div class="card"><h2 style="margin-top:0">${tx('famH1')}</h2><ul class="tips">${listBoth('famL1')}</ul></div>
   <div class="card"><h2 style="margin-top:0">${tx('famH2')}</h2><ul class="tips">${listBoth('famL2')}</ul></div>
   <div class="card" style="border-left:5px solid #2f7d7a"><p>${tx('famCall')}</p><a class="btn teal" href="tel:14416">${esc(L('callTM'))}</a></div>`;
}

function vSup(){
  const units=[['காவல் நிலையம் A','Station A',42,78],['காவல் நிலையம் B','Station B',35,46],['ஆயுதப்படை கம்பெனி','Armed Reserve Coy',64,31],['போக்குவரத்துப் பிரிவு','Traffic wing',27,62],['அனைத்து மகளிர் காவல் நிலையம்','All Women PS',8,null],['சைபர் குற்றப் பிரிவு','Cyber crime cell',6,null]];
  const kp=[['k1','61%','#b8433a'],['k2','88%','#e8a33d'],['k3','74%','#2b3680'],['k4','+12','#3f7d58']];
  return `${backBtn('more')}<h1>${tx('supTitle')}</h1><p>${tx('supIntro')}</p><span class="tag">${esc(L('demo'))}</span>
   <div class="kpis">${kp.map(k=>`<div class="kpi"><div class="v" style="color:${k[2]}">${k[1]}</div><div class="small muted">${esc(L(k[0]))}</div></div>`).join('')}</div>
   <h2>${tx('byUnit')}</h2><div class="card">
   ${units.map(u=>{const name=S.lang==='en'?u[1]:S.lang==='ta'?u[0]:u[0]+' / '+u[1];
     return `<div class="urow"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(name)}</b><span class="muted small">${u[2]} ${esc(L('persons'))}</span></div>
     ${u[3]===null?`<div class="small" style="color:var(--red);font-weight:700">${esc(L('hidden'))}</div>`:`<div class="bar"><i style="width:${u[3]}%;background:${u[3]<50?'#b8433a':u[3]<70?'#e8a33d':'#3f7d58'}"></i></div><div class="small muted">${u[3]}%</div>`}</div>`}).join('')}
   </div>
   <p class="muted small" style="margin-top:10px">${tx('kRule')}</p>
   <h2>${tx('checklist')}</h2><div class="card">
   ${T.cl[0].map((x,i)=>`<label style="display:flex;gap:10px;align-items:flex-start;padding:8px 0"><input type="checkbox" style="width:22px;height:22px;margin-top:2px;accent-color:#1e2761"><span>${S.lang==='en'?esc(T.cl[1][i]):esc(x)}${S.lang==='both'?`<span class="sub">${esc(T.cl[1][i])}</span>`:''}</span></label>`).join('')}
   </div>`;
}

function vPrivacy(){
  return `${backBtn('more')}<h1>${tx('prTitle')}</h1>
   <div class="card"><ul class="tips">${listBoth('pr')}</ul></div>
   <h2>${tx('theme')}</h2><div class="chips">${[['auto','tAuto'],['light','tLight'],['dark','tDark']].map(t=>`<button class="chip" data-theme-set="${t[0]}" aria-pressed="${S.theme===t[0]}">${esc(L(t[1]))}</button>`).join('')}</div>
   <div class="stack" style="margin-top:18px"><button class="btn red" data-act="clear">${esc(L('clearData'))}</button></div>
   <p class="muted small" style="margin-top:14px">${tx('about')}</p>`;
}

function vMore(){
  return `<h1>${tx('navMore')}</h1><div class="list">
   ${row('alert','#b8433a','tileIncident','tileIncidentS','incident')}
   ${row('wind','#c48a2e','tileBreath','tileBreathS','breath')}
   ${row('family','#2f7d7a','tileFamily','tileFamilyS','family')}
   ${row('grid','#1e2761','tileSup','tileSupS','sup')}
   ${row('shield','#3f7d58','tilePriv','tilePrivS','privacy')}
  </div>`;
}

/* ---------------- Render ---------------- */
const VIEWS={home:vHome,check:vCheck,help:vHelp,callback:vCallback,log:vLog,incident:vIncident,breath:vBreath,family:vFamily,sup:vSup,privacy:vPrivacy,more:vMore};
const TAB_OF={home:'home',check:'check',help:'help',callback:'help',log:'log',incident:'more',breath:'more',family:'more',sup:'more',privacy:'more',more:'more'};
function render(focus){
  document.documentElement.lang=S.lang==='en'?'en':'ta';
  if(S.theme==='auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme',S.theme);
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===S.lang));
  $('#notice').innerHTML=tx('notice');
  $('#main').innerHTML=VIEWS[view.name]();
  const tabs=[['home','home','navHome'],['check','check','navCheck'],['help','phone','navHelp'],['log','chart','navLog'],['more','more','navMore']];
  $('#tabs').innerHTML=tabs.map(t=>`<button data-go="${t[0]}" class="${t[0]==='help'?'help-tab':''}" ${TAB_OF[view.name]===t[0]?'aria-current="page"':''}>${I[t[1]]}<span>${esc(L(t[2]))}</span></button>`).join('');
  if(focus){window.scrollTo(0,0);$('#main').focus({preventScroll:true});}
}
function go(name){
  if(brTimer){clearInterval(brTimer);brTimer=null;view.brOn=false;}
  if(name==='check'){view.step=0;view.answers=[];view.safety=null;}
  if(name==='callback') view.ref=null;
  if(name==='incident'){view.incStage=null;incTypes=[];}
  view.name=name; render(true);
}

document.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.lang){S.lang=b.dataset.lang;save();render();return;}
  if(b.dataset.go){go(b.dataset.go);return;}
  if(b.dataset.mood){S.mood=b.dataset.mood;save();render();return;}
  if(b.dataset.ans!==undefined){view.answers[view.step-1]=+b.dataset.ans;render();return;}
  if(b.dataset.safety){view.safety=b.dataset.safety;render();return;}
  if(b.dataset.chip){const g=b.dataset.chip,v=b.dataset.val; if(g==='topics'){const i=cb.topics.indexOf(v); i>=0?cb.topics.splice(i,1):cb.topics.push(v);} else cb[g]=v;
    const alias=$('#alias')?$('#alias').value:''; render(); if($('#alias'))$('#alias').value=alias; return;}
  if(b.dataset.off){const k=weekKey();S.off=S.off.filter(o=>o.week!==k);S.off.push({week:k,v:b.dataset.off});save();render();toast('saved');return;}
  if(b.dataset.inc){const i=incTypes.indexOf(b.dataset.inc); i>=0?incTypes.splice(i,1):incTypes.push(b.dataset.inc); render(); return;}
  if(b.dataset.themeSet){S.theme=b.dataset.themeSet;save();render();return;}
  const a=b.dataset.act;
  if(a==='startCheck'){view.step=1;render(true);}
  else if(a==='nextQ'){view.step++;render(true);}
  else if(a==='prevQ'){view.step=Math.max(view.step===1?0:1,view.step-1);render(true);}
  else if(a==='finish'){const raw=view.answers.reduce((x,y)=>x+y,0);const score=raw*4;view.chkDone={score,safety:view.safety};S.checks.push({date:today(),score});S.checks=S.checks.slice(-30);save();view.step=7;render(true);}
  else if(a==='sendReq'){view.ref='KN-'+Math.random().toString(36).slice(2,6).toUpperCase();S.requests.push({ref:view.ref,date:today(),who:cb.who,when:cb.when});save();render(true);}
  else if(a==='saveSleep'){
    const h=parseFloat($('#sh').value), d=parseFloat($('#dh').value), q=+$('#sq').value;
    if(isNaN(h)||isNaN(d)||h<0||h>16||d<0||d>24){$('#sh').focus();return;}
    S.sleep=S.sleep.filter(x=>x.date!==today());S.sleep.push({date:today(),h,d,q});S.sleep.sort((x,y)=>x.date<y.date?-1:1);S.sleep=S.sleep.slice(-60);save();render();toast('saved');}
  else if(a==='incYes'){view.incStage='yes';render(true);}
  else if(a==='incNo'){view.incStage='done';view.incMsg='incNoMsg';render(true);}
  else if(a==='incFine'){S.incident={date:Date.now(),types:incTypes.slice(),remind:Date.now()+7*86400000};save();view.incStage='done';view.incMsg='incRemind';render(true);}
  else if(a==='incWO'){S.incident={date:Date.now(),types:incTypes.slice(),remind:null};cb.who='whoWO';cb.topics=['tInc'];save();view.name='callback';view.ref=null;render(true);}
  else if(a==='brStart'){view.brOn=true;brPhase=0;brCount=4;brRounds=0;render();brTimer=setInterval(brTick,1000);}
  else if(a==='brStop'){clearInterval(brTimer);brTimer=null;view.brOn=false;render();}
  else if(a==='clear'){if(confirm(L('confirmClear'))){const lang=S.lang;S={lang,theme:'auto',mood:null,checks:[],sleep:[],off:[],incident:null,requests:[]};try{localStorage.removeItem(KEY);}catch(e){}save();render();toast('cleared');}}
});
document.addEventListener('input',e=>{if(e.target.id==='sq'){const v=$('#sqv'); if(v) v.textContent=e.target.value;}});
render();
</script>
</body>
</html>
